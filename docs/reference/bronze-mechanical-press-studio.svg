<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img">
<title>Magneticraft2 Mechanical Press — editable Studio reference</title>
<desc>True 3 by 3 by 3 Mechanical Press. The front view shows a supported copper headstock, guided moving die and stone press table. The server SOUTH blueprint maps rear mechanical input and left/right item ports; the Patchouli pattern is mirrored separately.</desc>
