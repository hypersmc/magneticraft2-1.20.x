<rect x="23" y="756" width="1393" height="110" rx="12" class="card"/>
<text x="49" y="787" class="title">K1 PROCESS &amp; TECHNICAL LIMITS</text>
<text x="50" y="816" class="label">4 Copper Plates  →  4 Copper Sheets  •  180 powered ticks  •  ≥16 RPM / ≥6 torque  •  512-batch roller sleeve service</text>
<text x="50" y="844" class="hint">Sheet use: 4 Sheets → 8 Water Pipes (alternative to existing 6 Plates → 8 Pipes). Future hot bronze billets / rods are NOT implemented.</text>
