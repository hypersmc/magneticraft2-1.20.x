<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 890" width="1440" height="890" role="img" aria-labelledby="title desc">
<title id="title">Magneticraft2 Bronze Rolling Mill — Studio construction reference</title>
<desc id="desc">Editable schematic of the actual five-block-wide, three-block-high, three-block-deep Rolling Mill: supported upper and lower rollers on the rear input Z-axis, left input and right output, front controller, and blueprint layers.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#202a2c"/><stop offset="1" stop-color="#12171a"/></linearGradient>
 <linearGradient id="bronze" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#eaa16d"/><stop offset=".5" stop-color="#a95933"/><stop offset="1" stop-color="#703b2b"/></linearGradient>
 <linearGradient id="roll" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d0a78c"/><stop offset=".48" stop-color="#a46d53"/><stop offset="1" stop-color="#6c3f31"/></linearGradient>
 <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#8c8a83"/><stop offset="1" stop-color="#474a4a"/></linearGradient>
 <style>.head{font:700 35px Georgia,serif;fill:#f1e8d8}.sub{font:19px Arial,sans-serif;fill:#d4c6b1}.title{font:700 23px Georgia,serif;fill:#ebac75}.label{font:17px Arial,sans-serif;fill:#e4ddd1}.hint{font:14px Arial,sans-serif;fill:#bcb5aa}.card{fill:#202628;stroke:#795d46;stroke-width:2}.minor{stroke:#a28065;stroke-width:2;fill:none}.tag{font:700 17px Arial,sans-serif;fill:#111827}</style>
