<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 900" width="1380" height="900">
<title>Magneticraft2 Precision Boring Machine — editable 5 × 3 × 3 Studio reference</title>
<desc>Supported bronze-age horizontal precision boring tool, clamped bronze bearing casting, stone and oak machine frame, two-height enclosed rear drive and actual JSON layer layout. One machine and exact real ports; not a final texture sheet.</desc>
